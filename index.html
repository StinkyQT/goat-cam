<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Goat Cam 🐐</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css" />

  <!-- Critical "app shell" layout: lock the page to the viewport (no page scrolling) -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0b0b;
    }
    * { box-sizing: border-box; }

    /* App shell */
    #app {
      height: 100vh; /* fallback */
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Video region takes remaining space */
    #videoWrap {
      position: relative;
      flex: 1;
      min-height: 0;     /* critical: allows flex child to shrink */
      overflow: hidden;  /* prevents accidental page scroll */
    }
    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }

    /* Controls: dense + responsive + capped height */
    #controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      align-items: center;

      /* keep controls from ever forcing page scroll */
      max-height: 32dvh;
      overflow: hidden;
    }

    /* On wider screens, keep all 3 controls in one row */
    @media (min-width: 520px) {
      #controls {
        grid-template-columns: 1fr 1fr auto;
      }
    }

    /* Scan rate label behaves like a “button-sized” control */
    #controls .chk {
      grid-column: 1 / -1;
      display: inline-flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      white-space: nowrap;
    }
    @media (min-width: 520px) {
      #controls .chk { grid-column: auto; justify-self: end; }
    }

    /* Debug should never grow layout height */
    #debug {
      grid-column: 1 / -1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: .85;
      font-size: 12px;
    }

    /* Optional: small title overlay (doesn't consume layout height) */
    #titleOverlay {
      position: absolute;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      padding: 10px 12px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .2px;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      pointer-events: none;
      z-index: 5;
    }

    /* Keep the hidden canvas from affecting layout */
    #canvas { display: none; }
  </style>

  <!-- OCR + fuzzy match -->
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <div id="videoWrap">
      <video id="video" autoplay playsinline></video>

      <!-- Overlay -->
      <div id="overlay">
        <div id="titleOverlay">Goat Cam 🐐</div>

        <div id="bigMark" class="unknown">…</div>

        <div id="lines">
          <div class="line">
            <span class="label">Card</span>
            <span id="cardName">—</span>
          </div>

          <div class="line">
            <span class="label">Goat Pool</span>
            <span id="goatPool">—</span>
          </div>

          <div class="line">
            <span class="label">Banlist</span>
            <span id="banStatus" class="badge">—</span>
          </div>

          <div class="line">
            <span class="label">Earliest</span>
            <span id="earliest">—</span>
          </div>

          <div class="line small">
            <span class="label">OCR</span>
            <span id="ocrText">—</span>
          </div>
        </div>
      </div>

      <!-- Hidden canvas to grab frames -->
      <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="controls">
      <button id="startBtn">Start Camera</button>
      <button id="toggleScanBtn">Start Scanning</button>

      <label class="chk">
        Scan every
        <select id="scanRate">
          <option value="600">0.6s</option>
          <option value="900" selected>0.9s</option>
          <option value="1300">1.3s</option>
          <option value="1800">1.8s</option>
        </select>
      </label>

      <div id="debug"></div>
    </div>
  </div>
</body>
</html>
