<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <!-- Strong hints to avoid stale assets while iterating -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css" />

  <!-- OCR + fuzzy match -->
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

  <!-- Cache-bust app.js without renaming the file -->
  <script defer src="app.js?v=20260122164659"></script>

  <style>
    /* Hard app-shell: never page scroll */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }
    * { box-sizing: border-box; }

    #app {
      height: 100vh; /* fallback */
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #videoWrap {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: block;
    }

    /* Keep original controls in DOM; JS will move them into a fixed tray when camera starts */
    #controls {
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }

    /* Title overlay (doesn't steal layout height) */
    #titlePill {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9997;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
      color: white;
      font: 700 14px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing: .2px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="titlePill">Goat Cam 🐐</div>

  <div id="app">
    <div id="videoWrap">
      <video id="video" autoplay playsinline></video>

      <!-- Overlay -->
      <div id="overlay">
        <div id="bigMark" class="unknown">…</div>

        <div id="lines">
          <div class="line">
            <span class="label">Card</span>
            <span id="cardName">—</span>
          </div>

          <div class="line">
            <span class="label">Goat Pool</span>
            <span id="goatPool">—</span>
          </div>

          <div class="line">
            <span class="label">Banlist</span>
            <span id="banStatus" class="badge">—</span>
          </div>

          <div class="line">
            <span class="label">Earliest</span>
            <span id="earliest">—</span>
          </div>

          <div class="line small">
            <span class="label">OCR</span>
            <span id="ocrText">—</span>
          </div>
        </div>
      </div>

      <!-- Hidden canvas to grab frames -->
      <canvas id="canvas" width="1280" height="720"></canvas>
    </div>

    <div id="controls">
      <button id="startBtn">Start Camera</button>
      <button id="toggleScanBtn">Start Scanning</button>

      <label class="chk">
        Scan every
        <select id="scanRate">
          <option value="600">0.6s</option>
          <option value="900" selected>0.9s</option>
          <option value="1300">1.3s</option>
          <option value="1800">1.8s</option>
        </select>
      </label>

      <div id="debug" style="width:100%;opacity:.85;font-size:12px;"></div>
    </div>
  </div>
</body>
</html>
